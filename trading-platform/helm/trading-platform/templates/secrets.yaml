# Trading Secrets - Encrypt with SOPS before applying
# Usage: sops -e -i trading-secrets.yaml && kubectl apply -f trading-secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: trading-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trading-platform.labels" . | nindent 4 }}
    app.kubernetes.io/managed-by: security-audit
  annotations:
    # SOPS manages this file - edit with: sops trading-secrets.yaml
    secrets.yaml.sops.io/v2: encrypted
type: Opaque
stringData:
  # JWT authentication
  EXECUTE_JWT_SECRET_KEY: {{ .Values.executeService.env.JWT_SECRET_KEY | default "" | quote }}

  # Exchange private keys
  EXECUTE_HYPERLIQUID_PRIVATE_KEY: {{ .Values.executeService.env.HYPERLIQUID_PRIVATE_KEY | default "" | quote }}
  EXECUTE_SOLANA_PRIVATE_KEY_BASE58: {{ .Values.executeService.env.SOLANA_PRIVATE_KEY_BASE58 | default "" | quote }}

  # Database credentials
  POSTGRES_PASSWORD: {{ .Values.postgres.postgresqlPassword | default "" | quote }}
  NEWS_DB_PASSWORD: {{ .Values.newsService.env.NEWS_DB_PASSWORD | default "" | quote }}

  # Redis
  REDIS_PASSWORD: {{ .Values.redis.redisPassword | default "" | quote }}

  # Kafka SASL
  KAFKA_SASL_USERNAME: {{ .Values.kafka.saslUsername | default "" | quote }}
  KAFKA_SASL_PASSWORD: {{ .Values.kafka.saslPassword | default "" | quote }}

---
# mTLS certificates (generated by cert-manager, mounted as volumes)
# Service account tokens for SPIFFE/SPIRE identity
apiVersion: v1
kind: Secret
metadata:
  name: trading-mtls-certs
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trading-platform.labels" . | nindent 4 }}
type: kubernetes.io/tls
# tls.crt and tls.key populated by cert-manager
