{{- if .Values.networkPolicies.enabled }}
{{- if .Values.networkPolicies.defaultDenyIngress }}
# Deny all ingress traffic by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/managed-by: security-audit
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
{{- end }}
{{- if .Values.networkPolicies.defaultDenyEgress }}
# Deny all egress traffic by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-egress
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/managed-by: security-audit
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
{{- end }}
{{- if .Values.networkPolicies.allowDNS }}
# Allow all pods to resolve DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
{{- end }}
# Execute Service networking
{{- if .Values.executeService.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execute-service-networking
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: execute-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gce-proxy
      ports:
        - port: {{ .Values.executeService.port }}
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app: news-service
      ports:
        - port: {{ .Values.executeService.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
          protocol: TCP
---
{{- end }}
# News Service networking
{{- if .Values.newsService.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: news-service-networking
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: news-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: {{ .Values.newsService.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: customer1-cnpg
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: execute-service
      ports:
        - port: {{ .Values.executeService.port }}
          protocol: TCP
---
{{- end }}
# Database networking
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-networking
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: execute-service
        - podSelector:
            matchLabels:
              app: data-service
      ports:
        - port: 5432
          protocol: TCP
  egress: []
---
# Redis networking
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-networking
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: execute-service
        - podSelector:
            matchLabels:
              app: data-service
      ports:
        - port: 6379
          protocol: TCP
---
# Kafka networking
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-networking
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: execute-service
        - podSelector:
            matchLabels:
              app: news-service
        - podSelector:
            matchLabels:
              app: data-service
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
---
# Dashboard networking
{{- if .Values.dashboard.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-networking
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: {{ .Values.dashboard.port }}
          protocol: TCP
  egress: []
---
{{- end }}
# Data Service networking
{{- if .Values.dataService.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-service-networking
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: data-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: {{ .Values.dataService.port }}
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092
          protocol: TCP
---
{{- end }}
{{- end }}
