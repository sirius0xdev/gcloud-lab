# Shared ConfigMap for trading platform configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trading-platform.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trading-platform.labels" . | nindent 4 }}
data:
  # Shared environment configuration
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  CLUSTER_NAME: {{ .Values.global.clusterName | quote }}
  NAMESPACE: {{ .Values.global.namespace | quote }}
  # Kafka bootstrap (internal DNS)
  KAFKA_BOOTSTRAP: kafka-headless.{{ .Values.global.namespace }}.svc.cluster.local:9092
  # Redis connection
  REDIS_HOST: redis-master.{{ .Values.global.namespace }}.svc.cluster.local
  REDIS_PORT: "6379"
  # PostgreSQL connection (execute-service uses EXECUTE_ prefix)
  EXECUTE_DB_HOST: postgres-primary.{{ .Values.global.namespace }}.svc.cluster.local
  EXECUTE_DB_PORT: "5432"
  EXECUTE_DB_NAME: "trading_data"
  # Legacy keys (other services)
  POSTGRES_HOST: postgres-primary.{{ .Values.global.namespace }}.svc.cluster.local
  POSTGRES_PORT: "5432"
  # Solana RPC (ExternalName service)
  {{- if .Values.solanaRpc.enabled }}
  SOLANA_RPC_URL: "http://solana-rpc.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.solanaRpc.port }}"
  {{- end }}
