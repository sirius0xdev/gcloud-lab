{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "trading-platform.fullname" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "trading-platform.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  rules:
    {{- range $host := .Values.ingress.hosts }}
    - host: {{ $host.host | quote }}
      http:
        paths:
          {{- range $path := $host.paths }}
          - path: {{ $path.path }}
            pathType: {{ $path.pathType }}
            backend:
              service:
                name: {{ $path.service }}
                port:
                  {{- if eq $path.service "dashboard" }}
                  number: {{ $.Values.dashboard.port }}
                  {{- else if eq $path.service "execute-service" }}
                  number: {{ $.Values.executeService.port }}
                  {{- else if eq $path.service "news-service" }}
                  number: {{ $.Values.newsService.port }}
                  {{- else if eq $path.service "data-service" }}
                  number: {{ $.Values.dataService.port }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
