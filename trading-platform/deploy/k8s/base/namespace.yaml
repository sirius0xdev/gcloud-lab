apiVersion: v1
kind: Namespace
metadata:
  name: customer1
  labels:
    name: customer1
    istio-injection: disabled # Disable Istio if using native K8s policies
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-platform-config
  namespace: customer1
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka-headless:9092"
  REDIS_URL: "redis://redis-master:6379/0"
  LOG_LEVEL: "info"
  TRADING_ENV: "production"
