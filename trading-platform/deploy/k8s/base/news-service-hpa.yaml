apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: news-service-hpa
  namespace: customer1
  labels:
    app: news-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: news-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
