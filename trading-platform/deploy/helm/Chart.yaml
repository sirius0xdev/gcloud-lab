# =============================================================================
# Trading Platform — Root Helm Chart
# =============================================================================
apiVersion: v2
name: trading-platform
description: Helm chart for the entire trading platform microservices
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: api-gateway
    version: "0.1.0"
    repository: "file://../api-gateway"
  - name: execute-service
    version: "0.1.0"
    repository: "file://../execute-service"
  - name: data-service
    version: "0.1.0"
    repository: "file://../data-service"
  - name: news-service
    version: "0.1.0"
    repository: "file://../news-service"
  - name: dashboard
    version: "0.1.0"
    repository: "file://../dashboard"
  - name: cert-manager
    version: "1.14.0"
    repository: https://charts.jetstack.io
    condition: cert-manager.enabled
  - name: ingress-nginx
    version: "4.9.0"
    repository: https://kubernetes.github.io/ingress-nginx
    condition: ingress-nginx.enabled
