apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: paaas-healthcheck
  namespace: customer1
spec:
  targetRef:
    group: ""
    kind: Service
    name: paaas-landing-svc
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
    config:
      type: HTTP
      httpHealthCheck:
        portSpecification: USE_SERVING_PORT
        requestPath: /
