apiVersion: apps/v1
kind: Deployment
metadata:
  name: paaas-landing
  namespace: customer1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paaas-landing
  template:
    metadata:
      labels:
        app: paaas-landing
    spec:
      containers:
      - name: web
        image: ghcr.io/sirius0xdev/hermes_workspace:paaas-landing 
        imagePullPolicy: Always
        ports:
        - containerPort: 8080 
        resources:
          requests:
            cpu: 10m
            memory: 100Mi
          limits:
            cpu: 50m
            memory: 150Mi
        startupProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
            successThreshold: 1
        
        readinessProbe:
          httpGet:
            path: /          # or /index.html if needed
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30 
---
apiVersion: v1
kind: Service
metadata:
  name: paaas-landing-svc
  namespace: customer1
  annotations:
    networking.gke.io/healthcheck-policy: paaas-healthcheck
spec:
  selector:
    app: paaas-landing
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
