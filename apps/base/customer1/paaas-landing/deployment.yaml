apiVersion: apps/v1
kind: Deployment
metadata:
  name: paaas-landing
  namespace: customer1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paaas-landing
  template:
    metadata:
      labels:
        app: paaas-landing
    spec:
      containers:
      - name: web
        image: ghcr.io/sirius0xdev/paaas:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 128Mi

        startupProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1

        readinessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        livenessProbe:
          httpGet:
            path: /
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

---
apiVersion: v1
kind: Service
metadata:
  name: paaas-landing-svc
  namespace: customer1
  annotations:
    networking.gke.io/healthcheck-policy: paaas-healthcheck
spec:
  selector:
    app: paaas-landing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
