---
apiVersion: v1
kind: Service
metadata:
  name: hermes-webui-service
  namespace: customer1
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "hermes-webui"
    tailscale.com/tags: "tag:k8s-operator"
    tailscale.com/ports: "http:8787"
spec:
  type: ClusterIP
  selector:
    app: hermes-agent
  ports:
    - port: 8787
      targetPort: 8787
      name: http
