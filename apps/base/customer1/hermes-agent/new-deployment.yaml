apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  namespace: customer1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      shareProcessNamespace: true 
      securityContext:
        fsGroup: 1000

      volumes:
      - name: hermes-home
        persistentVolumeClaim:
          claimName: hermes-agent-pvc
      - name: hermes-agent-src
        emptyDir: {}
      - name: hermes-workspace
        emptyDir: {}
      - name: hermes-webui-app
        emptyDir: {}
      - name: hermes-configmap
        configMap:
          name: hermes-config

      initContainers:
      - name: copy-agent-source
        image: nousresearch/hermes-agent:latest
        command: 
        - "sh"
        - "-c"
        - |
          cp -a /opt/hermes/. /shared-src/ && chown -R 1024:1000 /shared-src /shared-home
          
          if [ -f /tmp/hermes/config.yaml ]; then
            cp -f /tmp/hermes/config.yaml /shared-home/config.yaml
          fi
          
          mkdir -p /shared-home/.local/bin
          echo '#!/bin/sh' > /shared-home/.local/bin/gh
          echo 'exit 1' >> /shared-home/.local/bin/gh
          chmod +x /shared-home/.local/bin/gh

        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
        - name: hermes-agent-src
          mountPath: /shared-src
        - name: hermes-home
          mountPath: /shared-home
        - name: hermes-configmap
          mountPath: /tmp/hermes/config.yaml
          subPath: config.yaml 
      containers:
      - name: hermes-agent
        image: nousresearch/hermes-agent:latest
        args: ["gateway", "run"]
        ports:
        - containerPort: 8642
        - containerPort: 9118  # Gateway webhook port
        env:
        - name: PATH
          value: "/home/hermes/.hermes/.local/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        - name: HOME
          value: "/home/hermes/.hermes"
        - name: HERMES_HOME
          value: "/home/hermes/.hermes"
        - name: HERMES_UID
          value: "1024"
        - name: HERMES_GID
          value: "1000"
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes-secrets
              key: TELEGRAM_BOT_TOKEN 
        - name: XAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: xai-apikey
              key: XAI_API_KEY 
        - name: TELEGRAM_ALLOWED_USERS
          value: "7528130947"        
        - name: TELEGRAM_WEBHOOK_URL
          value: "https://wh.siriusdevops.com/telegram/webhook/default"  # Webhook
        - name:  TELEGRAM_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: telegram-webhook
              key: TELEGRAM_WEBHOOK_SECRET 
        - name: OPENAI_BASE_URL
          value: "http://openclaw-brain-service.customer1.svc.cluster.local:8000/v1"
        - name: HERMES_MODEL_PROVIDER
          value: xai
        - name: HERMES_MODEL 
          value: grok-4.20-0309-reasoning
        - name: OPENAI_API_KEY
          value: "dummy"        
        volumeMounts:
        - name: hermes-home
          mountPath: /home/hermes/.hermes
        - name: hermes-agent-src
          mountPath: /opt/hermes
        securityContext:
          runAsUser: 1024
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: true
      - name: hermes-webui
        image: ghcr.io/nesquena/hermes-webui:latest
        ports:
        - containerPort: 8787
        env:
        - name: HOME
          value: "/home/hermeswebui/.hermes"
        - name: HERMES_HOME
          value: "/home/hermeswebui/.hermes"
        - name: HERMES_WEBUI_HOST
          value: "0.0.0.0"
        - name: HERMES_WEBUI_PORT
          value: "8787"
        - name: HERMES_WEBUI_STATE_DIR
          value: "/home/hermeswebui/.hermes/webui"
        - name: WANTED_UID
          value: "1024"
        - name: WANTED_GID
          value: "1000"
        - name: HERMES_SKIP_CHMOD
          value: "1"
        volumeMounts:
        - name: hermes-home
          mountPath: /home/hermeswebui/.hermes
        - name: hermes-agent-src
          mountPath: /home/hermeswebui/.hermes/hermes-agent
        - name: hermes-workspace
          mountPath: /workspace
        - name: hermes-webui-app
          mountPath: /app
        resources:
          requests:
            memory: 500Mi
            cpu: "100m"
          limits:
            memory: 1Gi
            cpu: "500m"
        securityContext:
          runAsUser: 1024
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: true 
          readOnlyRootFilesystem: false
          seccompProfile:
            type: RuntimeDefault 
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-gateway
  namespace: customer1
spec:
  selector:
    app: hermes-agent
  ports:
  - name: webhook
    port: 9118
    targetPort: 9118
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-agent-pvc
  namespace: customer1
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 25Gi
