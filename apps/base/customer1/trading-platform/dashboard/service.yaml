apiVersion: v1
kind: Service
metadata:
  name: trading-dashboard-svc
  namespace: customer1
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "trading-dashboard"
    tailscale.com/tags: "tag:k8s-operator"
spec:
  selector:
    app: trading-dashboard
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
