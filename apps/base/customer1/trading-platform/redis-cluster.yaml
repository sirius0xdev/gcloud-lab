# Redis Stack with RediSearch for vector similarity search (HNSW, 768-dim)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trading-redis-pvc
  namespace: customer1
  labels:
    app: trading-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: trading-redis
  namespace: customer1
  labels:
    app: trading-redis
spec:
  selector:
    app: trading-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-redis-config
  namespace: customer1
  labels:
    app: trading-redis
data:
  redis.conf: |
    # Memory - increased for RediSearch vector indexes
    maxmemory 1gi
    maxmemory-policy allkeys-lru

    # Persistence
    save 900 1
    save 300 10
    save 60 10000
    appendonly yes
    appendfsync everysec
    dir /data

    # RediSearch module loaded automatically by redis-stack image
    # HNSW index config tuned for 768-dim vectors (e.g. nomic-embed-text)
    # HNSWARGB: initial_cap=2048, M=16, EF_CONSTRUCTION=200, EF_RUNTIME=40
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-redis
  namespace: customer1
  labels:
    app: trading-redis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trading-redis
  template:
    metadata:
      labels:
        app: trading-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis/redis-stack:7.4.2-v16
          ports:
            - containerPort: 6379
              name: redis
            - containerPort: 8001
              name: redis-insight
          args:
            - redis-server
            - /etc/redis/redis.conf
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/redis
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: trading-redis-config
        - name: data
          persistentVolumeClaim:
            claimName: trading-redis-pvc
