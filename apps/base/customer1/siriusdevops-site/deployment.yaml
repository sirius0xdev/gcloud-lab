apiVersion: apps/v1
kind: Deployment
metadata:
  name: siriusdevops-site
  namespace: customer1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siriusdevops-site
  template:
    metadata:
      labels:
        app: siriusdevops-site
    spec:
      containers:
      - name: nginx
        image: ghcr.io/sirius0xdev/siriusdevops:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 128Mi

        startupProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1

        readinessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        livenessProbe:
          httpGet:
            path: /
            port: 80
            scheme: HTTP
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

---
apiVersion: v1
kind: Service
metadata:
  name: siriusdevops-site-svc
  namespace: customer1
spec:
  selector:
    app: siriusdevops-site
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
