apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: trading-kafka
  namespace: customer1
spec:
  kafka:
    replicas: 1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    storage:
      type: persistent-claim
      size: 10Gi
    config:
      auto.create.topics.enable: true
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
    template:
      pod:
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
        containers:
          - name: kafka
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi
  entityOperator:
    topicOperator: {}
