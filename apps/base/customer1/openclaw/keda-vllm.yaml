apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: openclaw-brain-a100-scaling
  namespace: customer1
spec:
  scaleTargetRef:
    name: openclaw-brain-vllm
    kind: Deployment
    apiVersion: apps/v1
  replicas:
    min: 0
    max: 1
  host: openclaw-brain-service.customer1.svc.cluster.local
  targetPendingRequests: 1
  scaledownPeriod: 900
