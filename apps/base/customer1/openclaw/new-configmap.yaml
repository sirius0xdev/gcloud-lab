apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: customer1
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true
        }
      },

      "channels": {
        "telegram": {
          "enabled": true,
          "dmPolicy": "allowlist",
          "groupPolicy": "allowlist",
          "allowFrom": ["7528130947"],
          "groups": {
            "*": {
              "requireMention": false
            }
          }
        }
      },

      "models": {
        "providers": {
          "local-vllm": {
            "baseUrl": "http://openclaw-brain-service.customer1.svc.cluster.local:8000/v1",
            "apiKey": "EMPTY",
            "api": "openai-completions",
            "models": [
              {
                "id": "Youssofal/Qwen3.6-27B-Abliterated-Heretic-Uncensored-BF16",
                "name": "Qwen3.5-27B-Heretic",
                "reasoning": true,
                "contextWindow": 40960
              }
            ]
          }
        }
      },

      "agents": {
        "defaults": {
          "model": {
            "primary": "xai/grok-4.1-fast",
            "fallbacks": ["local-vllm/llmfan46/Qwen3.5-27B-uncensored-heretic"]
          },
          "workspace": "/home/node/.openclaw/workspace",
          "maxConcurrent": 4,
          "subagents": {
            "maxConcurrent": 8
          }
        },
        "list": [
          {
            "id": "default",
            "name": "Grok Assistant",
            "model": "xai/grok-4.1-fast",
            "workspace": "/home/node/.openclaw/workspace"
          },
          {
            "id": "sirius-trade",
            "name": "Sirius Trade",
            "model": "local-vllm/Youssofal/Qwen3.6-27B-Abliterated-Heretic-Uncensored-BF16",
            "thinking": "medium",
            "workspace": "/home/node/.openclaw/workspace"
          },
          {
            "id": "sirius-ops",
            "name": "Sirius Ops",
            "model": "xai/grok-4.1-fast",
            "workspace": "/home/node/.openclaw/workspace"
          },
          {
            "id": "sirius-research",
            "name": "Sirius Research",
            "model": "local-vllm/Youssofal/Qwen3.6-27B-Abliterated-Heretic-Uncensored-BF16",
            "thinking": "high",
            "workspace": "/home/node/.openclaw/workspace"
          },
          {
            "id": "sirius-auditor",
            "name": "Sirius Auditor",
            "model": "local-vllm/Youssofal/Qwen3.6-27B-Abliterated-Heretic-Uncensored-BF16",
            "thinking": "high",
            "workspace": "/home/node/.openclaw/workspace"
          }
        ]
      },

      "cron": {
        "enabled": true
      }
    }
  AGENTS.md: |
    # Sirius Claw
    Professional, precise, dark humor. Running in Lance's GKE cluster.
