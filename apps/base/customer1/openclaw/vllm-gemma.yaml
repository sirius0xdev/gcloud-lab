apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw-brain-vllm
  namespace: customer1
  labels:
    app: openclaw-brain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw-brain
  template:
    metadata:
      labels:
        app: openclaw-brain
    spec:
      nodeSelector:
        cloud.google.com/gke-accelerator: "nvidia-a100-80gb"
      tolerations:
        - key: "nvidia.com/gpu-a100-80gb"
          operator: "Equal"
          value: "present"
          effect: "NoSchedule"
      containers:
        - name: vllm-brain
          image: vllm/vllm-openai:latest
          command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
          args:
            - "--model"
            - "cognitivecomputations/dolphin-2.9.2-qwen1.5-32b" # Native 32B Uncensored (fits perfectly in 80GB VRAM)
            - "--dtype"
            - "half"
            - "--max-model-len"
            - "16384"
          ports:
            - containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "32Gi"
              cpu: "8"
            requests:
              nvidia.com/gpu: 1
              memory: "16Gi"
              cpu: "4"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
      volumes:
        - name: model-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openclaw-brain-service
  namespace: customer1
spec:
  selector:
    app: openclaw-brain
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: ClusterIP
