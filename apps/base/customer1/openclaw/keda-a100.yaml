apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: openclaw-brain-a100-scaling
  namespace: customer1
spec:
  hosts:
    - a100-vllm.internal.cluster # Replace with actual internal routing host if needed
  scaleTargetRef:
    name: openclaw-brain-vllm
    kind: Deployment
    apiVersion: apps/v1
    service: openclaw-brain-service
    port: 8000
  paths:
  - path: "^/v1/chat/completions"
  replicas:
    min: 0
    max: 1
  scaledownPeriod: 3600 # 1 hour (3600s) idle before scaling to zero
