apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: openclaw-brain-a100-scaling
  namespace: customer1
spec:
  hosts:
    - openclaw-brain-service.customer1.svc.cluster.local
  scaleTargetRef:
    name: openclaw-brain-vllm
    kind: Deployment
    apiVersion: apps/v1
    service: openclaw-brain-service
    port: 8000
  replicas:
    min: 0
    max: 1
  scaledownPeriod: 900 # 15 minutes of idle time before scaling to zero
