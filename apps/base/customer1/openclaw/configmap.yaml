apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: customer1
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
          
        },
        "controlUi": {
          "enabled": true
        }
      },
      

      "channels": {
        "telegram": {
          "enabled": true,
          "dmPolicy": "allowlist",        
          "groupPolicy": "allowlist",
          "allowFrom": [
            "7528130947"
            
          ],
          "groups": {
            "*": {
                "requireMention": false 
            }
          }
        }
      },
      "models": {
        "providers": {
          "local-vllm": {
            "baseUrl": "http://openclaw-brain-service-l4.customer1.svc.cluster.local:8000/v1",
            "apiKey": "EMPTY",
            "api": "openai-completions",
            "models": [
              {
                "id": "trohrbaugh/Qwen2.5-Coder-7B-Instruct-heretic",
                "name": "Qwen2.5-Coder-7B-Heretic"
              }
            ]
          }
        }
      }, 
      "agents": {
        "defaults": {
          "model": { 
            "primary": "local-vllm/trohrbaugh/Qwen2.5-Coder-7B-Instruct-heretic",
            "fallbacks": ["google/gemini-3.1-pro-preview"]
          },
          "workspace": "/home/node/.openclaw/workspace"
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "/home/node/.openclaw/workspace"
          }
        ]
      },
      "cron": { "enabled": true } 
    }
  AGENTS.md: |
    # OpenClaw Assistant

    You are a helpful AI assistant running in Kubernetes.
