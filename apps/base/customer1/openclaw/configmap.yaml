apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: customer1
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "loopback",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true
        }
      },
      

      "channels": {
        "telegram": {
          "enabled": true,
          "dmPolicy": "allowlist",          # or "pairing" if you prefer
          "groupPolicy": "allowlist",
          "requireMention": true,           # safer in group chats
          "allowFrom": [
            "7528130947"
            # Add more user IDs if needed
          ],
          "groups": {
            "*": {
              "requireMention": true
            }
          }
        }
      },
      "security": {
        "pairingMode": "strict"
      }
    


      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace"
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace"
          }
        ]
      },
      "cron": { "enabled": false }
    }
  AGENTS.md: |
    # OpenClaw Assistant

    You are a helpful AI assistant running in Kubernetes.
