apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: customer1
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
          
        },
        "controlUi": {
          "enabled": true
        }
      },
      

      "channels": {
        "telegram": {
          "enabled": true,
          "dmPolicy": "allowlist",        
          "groupPolicy": "allowlist",
          "allowFrom": [
            "7528130947"
            
          ],
          "groups": {
            "*": {
                "requireMention": false 
            }
          }
        }
      },
      "models": {
        "providers": {
          "local-vllm": {
            "baseUrl": "http://openclaw-brain-service.customer1.svc.cluster.local:8000/v1",
            "apiKey": "EMPTY",
            "api": "openai-completions",
            "models": [
              {
                "id": "llmfan46/Qwen3.5-27B-uncensored-heretic",
                "name": "Qwen3.5-27B-Heretic",
                "reasoning": true,
                "contextWindow": 49782 
              }
            ]
          }
        }
      }, 
      "agents": {
        "defaults": {
          "model": { 
            "primary": "xai/grok-4.1-fast",
            "fallbacks": ["xai/grok-4.1-fast"]
          },
          "workspace": "/home/node/.openclaw/workspace"
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "/home/node/.openclaw/workspace"
          }
        ]
      },
      "cron": { "enabled": true },
      "requestTimeoutSeconds": 180,
      "promptCaching": true,
      "context": {
        "injectAllMarkdown": false,
        "curatedFiles": ["SOUL.md", "MEMORY.md", "IDENTITY.md", "USER.md"],
        "useMemorySearch": true
      }
    }
  AGENTS.md: |
    # Sirius Claw

    Professional, precise, dark humor. Running in Lance's GKE cluster.
