apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: customer1
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "loopback",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": true
        }
      },
      

      "channels": {
        "telegram": {
          "enabled": true,
          "dmPolicy": "allowlist",        
          "groupPolicy": "allowlist",
          "allowFrom": [
            "7528130947"
            
          ],
          "groups": {
            "*": {
                "requireMention": true
            }
          }
        }
      },
      
      "providers": {
        "openai": {
          "enabled": true,
          "baseUrl": "http://openclaw-brain-service.customer1.svc.cluster.local:8000/v1",
          "apiKey": "sk-local-vllm"
        }
      },

      "agents": {
        "defaults": {
          "model": { 
            "primary": "openai/dphn/Dolphin-Mistral-24B-Venice-Edition",
            "fallbacks": ["google/gemini-3.1-pro-preview"]
          },
          "workspace": "~/.openclaw/workspace"
        },
        "list": [
          {
            "id": "default",
            "name": "OpenClaw Assistant",
            "workspace": "~/.openclaw/workspace"
          }
        ]
      },
      "cron": { "enabled": false }
    }
  AGENTS.md: |
    # OpenClaw Assistant

    You are a helpful AI assistant running in Kubernetes.
