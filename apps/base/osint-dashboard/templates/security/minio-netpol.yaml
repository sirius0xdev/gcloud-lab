{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-netpol
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "osint-dashboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: osint-dashboard
      app.kubernetes.io/component: object-storage
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from dashboard services
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: osint-dashboard
      ports:
        - protocol: TCP
          port: {{ .Values.minio.ports.api }}
    # Allow console access (internal)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: osint-dashboard
      ports:
        - protocol: TCP
          port: {{ .Values.minio.ports.console }}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow to other MinIO pods (distributed replication)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: osint-dashboard
              app.kubernetes.io/component: object-storage
      ports:
        - protocol: TCP
          port: {{ .Values.minio.ports.api }}
{{- end }}
