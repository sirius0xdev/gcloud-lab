# ─── Kustomization ──────────────────────────────────────────────────────────

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: customer1

resources:
  - secret.yaml
  - deployment.yaml

configMapGenerator:
  - name: vwap-monitor-config
    envs:
      - config.env

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: vwap-monitor
      spec:
        template:
          spec:
            containers:
              - name: scanner
                envFrom:
                  - configMapRef:
                      name: vwap-monitor-config
                env:
                  - name: TELEGRAM_BOT_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: vwap-monitor-secrets
                        key: telegram-bot-token
                  - name: TELEGRAM_CHAT_ID
                    valueFrom:
                      secretKeyRef:
                        name: vwap-monitor-secrets
                        key: telegram-chat-id
