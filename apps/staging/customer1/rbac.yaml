apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-pvc-access
  namespace: customer1
rules:
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-pvc-access-binding
  namespace: customer1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-pvc-access
subjects:
- kind: Group
  name: system:nodes
  apiGroup: rbac.authorization.k8s.io