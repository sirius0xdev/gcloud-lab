apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  path: ../../../../infrastructure/controllers/base/certmanager/  # Relative to git repo root
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system  # Your bootstrap GitRepo
  healthChecks:
    - name: cert-manager-webhook
      kind: Deployment
      namespace: cert-manager

