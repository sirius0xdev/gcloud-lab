apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda-http-add-on
  namespace: keda
spec:
  interval: 1h
  chart:
    spec:
      chart: keda-add-ons-http
      version: ">= 0.8.0"
      sourceRef:
        kind: HelmRepository
        name: kedacore
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  dependsOn:
    - name: keda
