apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 1h
  chart:
    spec:
      chart: keda
      version: ">= 2.14.0"
      sourceRef:
        kind: HelmRepository
        name: kedacore
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
