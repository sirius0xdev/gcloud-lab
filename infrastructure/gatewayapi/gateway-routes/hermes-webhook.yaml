apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-webhook
  namespace: customer1
spec:
  parentRefs:
  - name: external-http-gateway
    sectionName: https
  hostnames:
  - "ws.siriusdevops.com"
  rules:
  - backendRefs:
    - name: hermes-gateway
      port: 8644
  - matches:
      - path:
          type: PathPrefix
          value: /telegram/webhook
