apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paaas-landing
  namespace: customer1
spec:
  parentRefs:
  - name: external-http-gateway
  hostnames:
  - paaas.siriusdevops.com

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    
    
    backendRefs:
    - name: paaas-landing-svc
      port: 80
