apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-secrets
  namespace: monitoring
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/grafana-admin-user/versions/latest"
        fileName: "admin-user"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/grafana-admin-password/versions/latest"
        fileName: "admin-password"
      - resourceName: "projects/YOUR_PROJECT_ID/secrets/grafana-env/versions/latest"
        fileName: "env"
  secretObjects:
  - secretName: grafana-admin-credentials
    type: Opaque
    data:
    - objectName: admin-user
      key: admin-user
    - objectName: admin-password
      key: admin-password
  - secretName: grafana-env
    type: Opaque
    data:
    - objectName: env
      key: env